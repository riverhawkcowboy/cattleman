name: PostgreSQL migration

on:
  pull_request:
    paths:
      - "database/**"
      - "scripts/test-migration.sh"
      - ".github/workflows/postgres-migration.yml"
  push:
    branches: [main]
    paths:
      - "database/**"
      - "scripts/test-migration.sh"
      - ".github/workflows/postgres-migration.yml"

jobs:
  migration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: cattleman_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cattleman_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cattleman_test
    steps:
      - uses: actions/checkout@v4
      - name: Apply migration and verify constraints
        run: sh scripts/test-migration.sh
